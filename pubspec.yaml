name: metatrader_clone
description: A MetaTrader-inspired trading platform clone
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  injectable: ^2.3.2
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  dartz: ^0.10.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^24.1.41
  web_socket_channel: ^2.4.0
  intl: ^0.19.0
  logger: ^2.0.2+1
  uuid: ^4.3.3
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  connectivity_plus: ^5.0.2
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.4.1
  freezed: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
