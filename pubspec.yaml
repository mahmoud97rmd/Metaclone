name: metatrader_clone
description: تطبيق تداول مالي احترافي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  bloc_concurrency: ^0.2.5
  
  # Functional Programming
  dartz: ^0.10.1
  
  # Networking & API
  dio: ^5.4.3+1
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0
  
  # WebSocket & Streaming
  web_socket_channel: ^3.0.1
  rxdart: ^0.28.0
  
  # Dependency Injection
  get_it: ^7.7.0
  
  # Charts
  fl_chart: ^0.68.0
  
  # UI & Utilities
  intl: ^0.19.0
  logger: ^2.4.0
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  
  # Testing
  mockito: ^5.4.4
  bloc_test: ^9.1.7
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
